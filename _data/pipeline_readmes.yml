"Eco-Flow/comparete": "# CompareTE\nA pipeline to compare TE content across genomes\
  \ using various platforms.\n\n<img src=\"https://raw.githubusercontent.com/Eco-Flow/comparete/main/assets/bitmap.png\"\
  \ alt=\"CompareTE pipeline\" width=\"70%\">\n\n# Requirements\n\n- **Nextflow**\
  \ >=26.04 ([install](https://www.nextflow.io/docs/latest/getstarted.html#installation))\n\
  - **Java** 11+ (required by Nextflow)\n- **Container engine** \u2014 one of:\n \
  \ - Docker\n  - Singularity / Apptainer\n  - (or install all tools manually if not\
  \ using containers)\n\nThe easiest approach is Docker + Nextflow on Linux/Mac, or\
  \ Docker Desktop on Windows.\n\n# Quick Start\n\nTo run the pipeline immediately\
  \ with test data:\n\n```bash\nnextflow run main.nf -profile docker,test_bacteria\n\
  ```\n\nThis runs Earl Grey, HiTE, and RepeatMasker on three bacterial genomes using\
  \ Docker. Results appear in `results/`.\n\nFor your own data, create a CSV file\
  \ (see [Input](#input) below) and run:\n\n```bash\nnextflow run main.nf --input\
  \ your_input.csv -profile docker\n```\n\n# Input\n\nInput should be a **samplesheet**\
  \ CSV file (ending in `.csv`) with **no header row**. \n\nEach row contains: `name,source`\
  \ where source is one of:\n\n**Option 1: RefSeq ID** (downloaded automatically)\n\
  ```\nEscherichia_coli,GCF_000005845.2\nBacillus_subtilis,GCF_000005825.4\n```\n\n\
  **Option 2: Local genome file**\n```\nDrosophila_melanogaster,/full/path/to/dm6.fa\n\
  Caenorhabditis_elegans,/full/path/to/ce11.fa\n```\n\n**Option 3: Genome + annotation**\
  \ (annotation is optional)\n```\nArabidopsis_thaliana,/full/path/to/TAIR10.fa,/full/path/to/TAIR10.gff3\n\
  ```\n\n**File format requirements:**\n\nGenome must end with: `.fa`, `.fasta`, `.fna`,\
  \ `.fa.gz`, `.fasta.gz`, or `.fna.gz`\n\nAnnotation (if provided) must end with:\
  \ `.gff`, `.gff3`, `.gff.gz`, or `.gff3.gz`\n\n**\u26A0\uFE0F Do not use relative\
  \ paths \u2014 use absolute paths only**\n\nSee examples in `data/` folder.\n\n\
  # Running the pipeline\n\nTo run the pipeline you need to make a csv input file\
  \ as described above with either Refseq IDs (these always begin GCF_...), or with\
  \ genomes, or genomes and annotation files.\n\nTo run with all the different TE\
  \ programs on a input csv file called `input.csv`:\n\n`nextflow run main.nf --orthofinder\
  \ --hite --earlgrey --input input.csv`\n\n**Though,** the above would require you\
  \ to manually download all the prerequisites and programs, so the easier way is\
  \ to set a container engine to pull all the programs you need:\n\n`nextflow run\
  \ main.nf --orthofinder --hite --earlgrey --input input.csv -profile docker/singularity/apptainer`\n\
  \n## Orthofinder (optional)\n\n[OrthoFinder v2.5.5](https://github.com/davidemms/OrthoFinder)\
  \ performs ortholog detection and generates a species tree. Use this if you want\
  \ to build a phylogenetic tree or identify orthologous genes across your input genomes.\n\
  \nRequires genome annotation (GFF file in the samplesheet). Run with:\n\n```bash\n\
  nextflow run main.nf --orthofinder --input your_input.csv -profile docker\n```\n\
  \nEarl Grey runs from the `tobybaril/earlgrey_dfam3.7` container, which already\
  \ ships a fully-configured RepeatMasker with Dfam 3.7. So in most cases you just\
  \ run:\n\n`nextflow run main.nf --earlgrey --input input.csv -profile singularity`\n\
  \nIf you want to use a **newer Dfam release**, pass `--famdb` pointing at a directory\
  \ containing the famdb partitions (e.g. `dfam39_full.N.h5` files):\n\n`nextflow\
  \ run main.nf --earlgrey --famdb /path/to/dfam39 --input input.csv -profile singularity`\n\
  \n`--famdb` is bind-mounted into the container at `/opt/conda/share/RepeatMasker/Libraries/famdb`,\
  \ overriding the bundled Dfam. Note this replaces only the famdb, not the container's\
  \ prebuilt RepeatMasker library, so a mismatched Dfam version may cause issues \u2014\
  \ the bundled Dfam 3.7 is the safest default.\n\n## RepeatMasker / RepeatModeler\
  \ (`--repeatmasker`)\n\nAn optional subworkflow annotates TEs with RepeatMasker,\
  \ using a repeat library built from your `--famdb` Dfam database (via `famdb.py`).\
  \ Optionally, `--run_repeatmodeler` first builds a de novo library per genome (slow)\
  \ and merges it with the Dfam library. The library is de-duplicated with a clustering\
  \ tool before masking.\n\n`nextflow run main.nf --repeatmasker --famdb /path/to/dfam39\
  \ --input input.csv -profile singularity`\n\nOptions:\n\n- `--run_repeatmodeler`\
  \ \u2014 also build a de novo library with RepeatModeler (adds substantial runtime\
  \ per genome).\n- `--te_clusterer` \u2014 `linclust` (default), `mmseqs`, or `cdhit`.\n\
  - `--repeatmasker_speed` \u2014 `qq` (fastest, default), `q`, or `default` (most\
  \ sensitive).\n- `--famdb_lineage` \u2014 lineage to extract from the famdb (e.g.\
  \ `hymenoptera`); defaults to `root`.\n\nOutputs (masked genome, `.out`, `.tbl`,\
  \ `.gff`, the repeat library, and a combined `.tsv`) are written to `results/repeatmasker/`.\n\
  \n## Combining TE methods (`PARSE_TE` / `COMBINE_TE`)\n\nWhenever one or more TE\
  \ methods are run (`--earlgrey`, `--hite`, `--repeatmasker`), the pipeline parses\
  \ each method's output into a normalised per-species, per-method table (`PARSE_TE`)\
  \ and then merges everything into combined outputs (`COMBINE_TE`). It reads Earl\
  \ Grey's `filteredRepeats.gff`, HiTE's RepeatMasker `.out`, and RepeatMasker's `.out`,\
  \ mapping all of them to common high-level TE classes (DNA, LTR, LINE, SINE, Penelope,\
  \ RC/Helitron, Other/Simple, Unclassified).\n\nThis works for **any subset** of\
  \ methods \u2014 one, two, or all three. Outputs in `results/compare_te/`:\n\n-\
  \ `combined_te_totals.tsv` \u2014 total TE bp, copy number, and % genome for every\
  \ species \xD7 method.\n- `combined_te_by_class.tsv` \u2014 per-class breakdown\
  \ for every species \xD7 method.\n- `combined_te_comparison.pdf` \u2014 a cross-species\
  \ totals bar chart (coloured by method) and a per-class figure faceted by species.\n\
  \n`nextflow run main.nf --earlgrey --hite --repeatmasker --famdb ... --input input.csv\
  \ -profile singularity`\n\n## HPC cluster profiles\n\nBundled institutional profiles\
  \ configure the scheduler, container engine, and resource limits for a specific\
  \ cluster. They already enable the right container engine, so you do **not** need\
  \ to add `-profile singularity` or an external `-c` config.\n\n| Profile | Cluster\
  \ | Scheduler | Container |\n| --- | --- | --- | --- |\n| `ucl_myriad` | UCL Myriad\
  \ | SGE | Singularity/Apptainer |\n| `cambridge` | University of Cambridge CSD3\
  \ | SLURM | Singularity |\n\nCombine an HPC profile with a test or input profile,\
  \ e.g. on UCL Myriad:\n\n`nextflow run main.nf -profile ucl_myriad,test_bacteria\
  \ -resume --hite`\n\nOn Cambridge CSD3, export your SLURM project/account first\
  \ (defaults to the `icelake` partition):\n\n```\nexport NXF_CAMBRIDGE_PROJECT=MYPROJECT-SL2-CPU\n\
  nextflow run main.nf -profile cambridge,test_bacteria -resume --hite\n```\n\n##\
  \ Useful additional flags:\n\n`-resume` : This allows the pipeline to resume from\
  \ the last failed process (using the nextflow cache-ing mechanism)\n`-bg`     :\
  \ This allows nextflow to run in the background, so you can continue to use your\
  \ terminal.\n\n# Current test commands:\n`nextflow run main.nf -profile docker,test_bacteria\
  \ -resume`\n\nTo run with HITE:\n\n`nextflow run main.nf -profile docker,test_bacteria\
  \ -resume --hite`\n\nTo run with EARL GREY:\n\n`nextflow run main.nf -profile docker,test_bacteria\
  \ -resume --earlgrey`\n\nTo run orthofinder on your input species:\n\n`nextflow\
  \ run main.nf -profile docker,test_bacteria -resume --orthofinder`\n\n# Test a docker\
  \ container:\n`docker run -it --volume $PWD:$PWD <container> bash`"
"Eco-Flow/excon": "# EXCON (v2.3.2)\n\nA Nextflow pipeline for gene family **EX**pansion\
  \ and **CON**traction analysis \nacross multiple species using CAFE5.\n\nGiven a\
  \ set of genome assemblies and annotations, EXCON builds orthogroups with \nOrthoFinder,\
  \ fits and compares multiple CAFE models to identify gene families \nevolving at\
  \ significantly different rates, and automatically selects the \nbest-fitting model\
  \ for downstream analysis. Optionally, GO enrichment analysis \ncan be run on expanded\
  \ and contracted gene families, and on genes grouped by \nchromosome.\n\nIt works\
  \ with any set of species that have a genome (fasta) and annotation (gff) file.\
  \ \n(minimum of 5 species ideally up to around 30). Maximum 100 species (normally).\
  \ \n\n## Overview\n\nThe general pipeline logic is as follows:\n\n<img width=\"\
  398\" alt=\"image\" src=\"https://raw.githubusercontent.com/Eco-Flow/excon/main/docs/images/excon_pipeline.3b.svg\"\
  \ align=\"right\" />\n\n* Downloads genome and annotation files from NCBI `[NCBIGENOMEDOWNLOAD]`,\
  \ or you provide your own.\n* Unzips the files, if necessary `[GUNZIP]`\n* Sanitises\
  \ GFF annotations and extracts longest isoform `[AGAT_SPKEEPLONGESTISOFORM]`.\n\
  * Gets the protein sequences `[GFFREAD]`.\n* Renames the genes to gene name (as\
  \ some will be isoform name) `RENAME_FASTA`.\n* Finds orthologous genes across species\
  \ `[ORTHOFINDER_CAFE]`, or accepts a pre-computed tree and orthogroups to skip this\
  \ step (see `--input_tree` / `--input_orthogroups`).\n* Rescales OrthoFinder branch\
  \ lengths and converts to an ultrametric tree for CAFE `[RESCALE_TREE]`, `[CAFE_PREP]`.\n\
  * Prepares gene count input, estimates the error model, and builds an ultrametric\
  \ tree `[CAFE_PREP]`.\n* Runs CAFE5 with k=1 to k=`cafe_max_k` (default 6) rate\
  \ categories in parallel `[CAFE_RUN_K]`.\n* Compares all k runs by AIC and selects\
  \ the best k `[CAFE_SELECT_K]`.\n* Re-runs CAFE5 at the best k with Poisson birth-death\
  \ (`-p`) `[CAFE_RUN_BEST]`.\n* Compares uniform vs Poisson model at the best k by\
  \ likelihood, selects the winner `[CAFE_MODEL_COMPARE]`.\n* Plots gene family expansions\
  \ and contractions for the best model `[CAFE_PLOT]`.\n\n### Optional \u2014 GO enrichment\
  \ (`--run_eggnog` or `--predownloaded_gofiles`)\n\n* GO annotation can be run in\
  \ two ways:\n- **Run EggNOG-mapper** (`--run_eggnog`): assigns GO terms from scratch\
  \ using the EggNOG database (~45 GB). \n  Provide `--eggnog_data_dir` to reuse a\
  \ pre-downloaded copy and avoid re-downloading on every run.\n- **Supply your own\
  \ GO files** (`--predownloaded_gofiles`): if you already have gene-to-GO mappings,\
  \ \n  point to a directory of `{species_id}.go.txt` files and skip EggNOG entirely\
  \ (see [Parameters](#go-annotation-optional) below).\n* Optionally downloads the\
  \ EggNOG-mapper database `[EGGNOG_DOWNLOAD]`. Default is on, unless you provide\
  \ it.\n* Optionally assigns GO terms to genes using EggNOG-mapper `[EGGNOGMAPPER]`,\
  \ or reads GO terms from user-supplied files.\n* Optionally prepares GO gene lists\
  \ from the best CAFE model results `[CAFE_GO_PREP]`.\n* Optionally runs GO enrichment\
  \ in parallel, one job per species/node \n  and direction (expansion/contraction)\
  \ `[CAFE_GO_RUN]`.\n\n### Optional \u2014 chromosome GO enrichment (`--chromo_go`,\
  \ requires GO annotation)\n\n* Optionally plots GO enrichment of genes by chromosome\
  \ `[CHROMO_GO]`.\n* Optionally summarizes GO enrichment by chromosome `[SUMMARIZE_CHROMO_GO]`.\n\
  \n### Optional \u2014 genome quality statistics (`--stats`)\n\n* Optionally describes\
  \ genome assembly and annotation:\n  - `[BUSCO_BUSCO]`: Completeness of the genome\
  \ compared to expected gene set.\n  - `[QUAST]`: Assembly contiguity statistics\
  \ (N50 etc).\n  - `[AGAT_SPSTATISTICS]`: Gene, exon, and intron statistics.\n\n\
  ## Installation\n\nNextflow pipelines require a few prerequisites. There is further\
  \ documentation on the nf-core webpage [here](https://nf-co.re/docs/usage/installation),\
  \ about how to install Nextflow.\n\n### Prerequisites\n\n- [Docker](https://docs.docker.com/engine/install/)\
  \ or [Singularity](https://docs.sylabs.io/guides/3.11/admin-guide/installation.html).\n\
  - [Java](https://www.java.com/en/download/help/download_options.html) and [openJDK](https://openjdk.org/install/)\
  \ >= 8 (**Please Note:** When installing Java versions are `1.VERSION` so `Java\
  \ 8` is `Java 1.8`).\n- [Nextflow](https://www.nextflow.io/docs/latest/getstarted.html)\
  \ >= `v25.10.0`.\n- When running nextflow with this pipeline, ideally run `NXF_VER=25.10.0`\
  \ beforehand, to ensure functionality on this version.\n\n### Install\n\nTo install\
  \ the pipeline please use the following commands but replace VERSION with a [release](https://github.com/Eco-Flow/excon/releases).\n\
  \n`wget https://github.com/Eco-Flow/excon/archive/refs/tags/VERSION.tar.gz -O -\
  \ | tar -xvf -`\n\nor\n\n`curl -L https://github.com/Eco-Flow/excon/archive/refs/tags/VERSION.tar.gz\
  \ --output - | tar -xvf -`\n\nThis will produce a directory in the current directory\
  \ called `excon-VERSION` which contains the pipeline.\n\n## Inputs\n\n### Required\n\
  \n* `--input /path/to/csv/file` - A singular csv file as input in one of the two\
  \ formats stated below.\n\nThis csv can take 2 forms:\n* A 2 field csv where each\
  \ row is a unique species name followed by a Refseq genome reference ID (**NOT**\
  \ a Genbank reference ID) i.e. `data/input_small-s3.csv`. The pipeline will download\
  \ the relevant genome fasta file and annotation gff3 (or gff augustus) file.\n*\
  \ A 3 field csv where each row is a unique species name, followed by an absolute\
  \ path to a genome fasta file, followed by an absolute path to an annotation gff3\
  \ (or gff augustus) file. Input can be gzipped (.gz) or not.\n\n**Please Note:**\
  \ The genome has to be chromosome level not contig level.\n\n2 fields (Name,Refseq_ID):\n\
  ```\nDrosophila_yakuba,GCF_016746365.2\nDrosophila_simulans,GCF_016746395.2\nDrosophila_santomea,GCF_016746245.2\n\
  ```\n\n3 fields (Name,genome.fna,annotation.gff):\n```\nDrosophila_yakuba,data/Drosophila_yakuba/genome.fna.gz,data/Drosophila_yakuba/genomic.gff.gz\n\
  Drosophila_simulans,data/Drosophila_simulans/genome.fna.gz,data/Drosophila_simulans/genomic.gff.gz\n\
  Drosophila_santomea,data/Drosophila_santomea/genome.fna.gz,data/Drosophila_santomea/genomic.gff.gz\n\
  ```\n\n> **Note:** Genomes should be chromosome-level, not contig-level. RefSeq\
  \ IDs must be used (not GenBank IDs).\n\n## Parameters\n\n### Core options\n\n|\
  \ Parameter | Description | Default |\n|-----------|-------------|---------|\n|\
  \ `--input` | Path to input CSV file | Required unless using `--input_tree` + `--input_orthogroups`\
  \ without `--run_eggnog` or `--stats` |\n| `--outdir` | Output directory | `results`\
  \ |\n| `--groups` | NCBI taxonomy group for genome download (e.g. `insects`, `bacteria`)\
  \ | `insects` |\n| `--help` | Display help message | `false` |\n| `--custom_config`\
  \ | Path to a custom Nextflow config file | `null` |\n\n### Quality statistics (optional)\n\
  \n| Parameter | Description | Default |\n|-----------|-------------|---------|\n\
  | `--stats` | Run BUSCO, QUAST and AGAT statistics on genomes | `null` |\n| `--busco_lineage`\
  \ | BUSCO lineage database (e.g. `insecta_odb10`) | `null` |\n| `--busco_mode` |\
  \ BUSCO mode (`genome`, `proteins`, `transcriptome`) | `null` |\n| `--busco_lineages_path`\
  \ | Path to local BUSCO lineage databases | `null` |\n| `--busco_config` | Path\
  \ to BUSCO config file | `null` |\n\n### OrthoFinder options (optional)\n\n| Parameter\
  \ | Description | Default |\n|-----------|-------------|---------|\n| `--orthofinder_v2`\
  \ | Use OrthoFinder v2.5.5 instead of v3.1.4. v2 produces Hierarchical Orthogroups\
  \ (`N0.tsv`) which have lower copy-number variance and are better suited to CAFE5.\
  \ v3 produces flat orthogroups (`Orthogroups.tsv`). Recommended for large datasets\
  \ (>30 species) or when CAFE5 fails to converge. | `false` |\n| `--orthofinder_method`\
  \ | Gene tree inference method: `msa` or `dendroblast` | `msa` |\n| `--orthofinder_search`\
  \ | Sequence search program: `diamond`, `blast`, or `mmseqs2` | `diamond` |\n| `--orthofinder_msa_prog`\
  \ | MSA program (requires `--orthofinder_method msa`): `mafft` or `muscle` | `mafft`\
  \ |\n| `--orthofinder_tree` | Tree inference method (requires `--orthofinder_method\
  \ msa`): `fasttree`, `raxml`, `raxml-ng`, or `iqtree` | `fasttree` |\n\n> **Note:**\
  \ `-A` and `-T` are only valid when `-M msa` is set. If you set `--orthofinder_msa_prog`\
  \ or `--orthofinder_tree` without `--orthofinder_method msa`, OrthoFinder will error.\n\
  \n### CAFE gene family evolution\n\n| Parameter | Description | Default |\n|-----------|-------------|---------|\n\
  | `--skip_cafe` | Skip CAFE analysis | `null` |\n| `--cafe_max_k` | Maximum number\
  \ of k rate categories to test (runs k=1 through k=N in parallel) | `6` |\n| `--cafe_max_differential`\
  \ | Maximum gene count differential for CAFE filtering on retry | `50` |\n| `--tree_scale_factor`\
  \ | Factor to multiply all OrthoFinder branch lengths by before `chronos()` converts\
  \ the tree to a time tree for CAFE5. Lower values can cause numerical issues. |\
  \ `1000` |\n| `--input_tree` | Path to a pre-computed rooted species tree (Newick\
  \ format) \u2014 skips OrthoFinder when used with `--input_orthogroups` | `null`\
  \ |\n| `--input_orthogroups` | Path to a pre-computed `Orthogroups.tsv` from a previous\
  \ OrthoFinder run \u2014 skips OrthoFinder when used with `--input_tree` | `null`\
  \ |\n\n> **Skipping OrthoFinder:** OrthoFinder is the slowest step in the pipeline.\
  \ If you have already run it\n> (the results are in `results/orthofinder_cafe/ortho_cafe/`),\
  \ you can reuse the outputs.\n> The orthogroups file to pass depends on which version\
  \ of OrthoFinder was used:\n>\n> **OrthoFinder v2 (`--orthofinder_v2`)** \u2014\
  \ use `N0.tsv` (Hierarchical Orthogroups):\n> ```\n> --input_tree results/orthofinder_cafe/ortho_cafe/Species_Tree/SpeciesTree_rooted_node_labels.txt\
  \ \\\n> --input_orthogroups results/orthofinder_cafe/ortho_cafe/Phylogenetic_Hierarchical_Orthogroups/N0.tsv\n\
  > ```\n>\n> **OrthoFinder v3 (default)** \u2014 use `Orthogroups.tsv` (flat orthogroups):\n\
  > ```\n> --input_tree results/orthofinder_cafe/ortho_cafe/Species_Tree/SpeciesTree_rooted_node_labels.txt\
  \ \\\n> --input_orthogroups results/orthofinder_cafe/ortho_cafe/Orthogroups/Orthogroups.tsv\n\
  > ```\n> Both `--input_tree` and `--input_orthogroups` must be supplied together.\
  \ If either is omitted, OrthoFinder runs normally.\n\n> **Note on CAFE model selection:**\
  \ The pipeline runs CAFE5 with k=1 through k=`cafe_max_k` (default 6) \n> rate categories\
  \ in parallel, then selects the best k by AIC. It then re-runs the best k with the\
  \ \n> Poisson birth-death option (`-p`) and picks the final model by likelihood.\
  \ Model selection results \n> (AIC table across k values) are in `results/cafe/model_comparison/`.\
  \ If scores cannot be parsed \n> (e.g. on very small datasets), the pipeline defaults\
  \ to the uniform model.\n\n### GO annotation (optional)\n\nGO enrichment requires\
  \ gene-to-GO mappings. Choose one of the two approaches below \u2014 they are mutually\
  \ exclusive, and `--run_eggnog` takes priority if both are set.\n\n#### Option A\
  \ \u2014 Run EggNOG-mapper\n\n| Parameter | Description | Default |\n|-----------|-------------|---------|\n\
  | `--run_eggnog` | Run EggNOG-mapper to assign GO terms | `false` |\n| `--eggnog_data_dir`\
  \ | Path to pre-downloaded EggNOG database directory | `null` (downloads ~45 GB\
  \ automatically) |\n| `--eggnog_target_taxa` | Restrict annotations to orthologs\
  \ from this taxon and its descendants (NCBI taxon ID) | `null` |\n| `--eggnog_tax_scope`\
  \ | Taxonomic scope for orthologous group assignment (e.g. `50557` for Insecta)\
  \ | `null` |\n| `--eggnog_evalue` | Maximum e-value threshold for sequence matches\
  \ | `null` |\n| `--eggnog_score` | Minimum bitscore threshold for matches | `null`\
  \ |\n| `--eggnog_pident` | Minimum percent identity (%) | `null` |\n| `--eggnog_query_cover`\
  \ | Minimum query coverage (%) | `null` |\n| `--eggnog_subject_cover` | Minimum\
  \ subject coverage (%) | `null` |\n| `--eggnog_rep_species` | Species to use as\
  \ the representative for the OG annotation summary (must match a species name in\
  \ the input CSV). Auto-selects the most-annotated species when unset. | `null` (auto)\
  \ |\n\n> **Note:** The EggNOG database is ~45 GB. We strongly recommend downloading\
  \ it once and passing `--eggnog_data_dir /path/to/eggnog_data` to avoid re-downloading\
  \ on every run.\n\n#### Option B \u2014 Supply your own GO files\n\n| Parameter\
  \ | Description | Default |\n|-----------|-------------|---------|\n| `--predownloaded_gofiles`\
  \ | Path to a directory of pre-computed gene-to-GO mapping files | `null` |\n\n\
  The directory must contain one file per species, named `{species_id}.go.txt` where\
  \ `species_id` matches the species names in your input CSV. Each file is a two-column,\
  \ tab-separated file with one gene\u2013GO pair per line:\n\n```\ngeneA    GO:0006412\n\
  geneA    GO:0008150\ngeneB    GO:0003674\n```\n\nThis lets you skip EggNOG entirely\
  \ if you already have GO annotations (e.g. from a previous run, a public database,\
  \ or another annotation tool).\n\n### GO enrichment analysis (optional, requires\
  \ GO annotation)\n\n| Parameter | Description | Default |\n|-----------|-------------|---------|\n\
  | `--chromo_go` | Run GO enrichment analysis by chromosome | `null` |\n| `--go_cutoff`\
  \ | P-value cutoff for GO enrichment | `0.05` |\n| `--go_type` | GO test type (e.g.\
  \ `none`) | `none` |\n| `--go_max_plot` | Maximum number of GO terms to plot | `10`\
  \ |\n| `--go_algo` | topGO algorithm and statistic (`classic_fisher`, `weight01_t`,\
  \ `elim_ks`, `weight_ks`). Results are written to a subfolder named after all three\
  \ GO settings (e.g. `cafe_go/weight01_t_cutoff0.05_typenone/`), so running with\
  \ different values preserves all results. | `classic_fisher` |\n\n### Resource limits\n\
  \n| Parameter | Description | Default |\n|-----------|-------------|---------|\n\
  | `--max_memory` | Maximum memory per job | `128.GB` |\n| `--max_cpus` | Maximum\
  \ CPUs per job | `16` |\n| `--max_time` | Maximum runtime per job | `240.h` |\n\n\
  ## Profiles\n\n| Profile | Description |\n|---------|-------------|\n| `docker`\
  \ | Run with Docker containers |\n| `singularity` | Run with Singularity containers\
  \ |\n| `conda` | Run with Conda environments |\n| `test_bacteria` | Test run with\
  \ small bacterial genomes |\n| `test_small` | Test run with small insect genomes\
  \ |\n\n\n## Profiles\n\nThis pipeline is designed to run in various modes that can\
  \ be supplied as a comma separated list i.e. `-profile profile1,profile2`.\n\n###\
  \ Container Profiles\n\nPlease select one of the following profiles when running\
  \ the pipeline.\n\n* `docker` - This profile uses the container software Docker\
  \ when running the pipeline. This container software requires root permissions so\
  \ is used when running on cloud infrastructure or your local machine (depending\
  \ on permissions). **Please Note:** You must have Docker installed to use this profile.\n\
  * `singularity` - This profile uses the container software Singularity when running\
  \ the pipeline. This container software does not require root permissions so is\
  \ used when running on on-premise HPCs or you local machine (depending on permissions).\
  \ **Please Note:** You must have Singularity installed to use this profile.\n* `apptainer`\
  \ - This profile uses the container software Apptainer when running the pipeline.\
  \ This container software does not require root permissions so is used when running\
  \ on on-premise HPCs or you local machine (depending on permissions). **Please Note:**\
  \ You must have Apptainer installed to use this profile.\n\n### Optional Profiles\n\
  \n* `local` - This profile is used if you are running the pipeline on your local\
  \ machine.\n* `aws_batch` - This profile is used if you are running the pipeline\
  \ on AWS utilising the AWS Batch functionality. **Please Note:** You must use the\
  \ `Docker` profile with with AWS Batch.\n* `test_small` - This profile is used if\
  \ you want to test running the pipeline on your infrastructure, running from predownloaded\
  \ go files. **Please Note:** You do not provide any input parameters if this profile\
  \ is selected but you still provide a container profile.\n* `test_biomart` - This\
  \ profile is used if you want to test running the pipeline on your infrastructure,\
  \ running from the biomart input. **Please Note:** You do not provide any input\
  \ parameters if this profile is selected but you still provide a container profile.\n\
  \n## Custom Configuration\n\nIf you want to run this pipeline on your institute's\
  \ on-premise HPC or specific cloud infrastructure then please contact us and we\
  \ will help you build and test a custom config file. This config file will be published\
  \ to our [configs repository](https://github.com/Eco-Flow/configs). \n\n## Running\
  \ the Pipeline\n\n**Please note:** The `-resume` flag uses previously cached successful\
  \ runs of the pipeline.\n\n1. Example run the full test example data:\n\n```\nNXF_VER=25.04.8\
  \ # Is latest it is tested on\nnextflow run main.nf -resume -profile docker,test_small\n\
  ```\n\n*Settings in test_small:*\ninput = \"input_small-s3.csv\"\n\nFor the fastest\
  \ run use: `nextflow run main.nf -resume -profile docker,test_bacteria`\n\n2. To\
  \ run on your own data (minimal run), cafe only. \n\n```\n# NXF_VER=25.04.8  \n\
  nextflow run main.nf -resume -profile docker --input data/input_small-s3.csv\n```\n\
  \n3. To run with cafe and GO analysis\n\n```\n# NXF_VER=25.04.8\nnextflow run main.nf\
  \ -resume -profile docker --input data/input_small-s3.csv --chromo_go --go_type\
  \ bonferoni --stats --run_eggnog --eggnog_data_dir /path/to/eggnogdb \n```\n\n4.\
  \ To run with CAFE and GO analysis using your own pre-computed GO files (skips EggNOG):\n\
  \n```\n# NXF_VER=25.04.8\nnextflow run main.nf -resume -profile docker --input data/input_small-s3.csv\
  \ --predownloaded_gofiles /path/to/go_files/\n```\n\nThe `go_files/` directory should\
  \ contain one `{species_id}.go.txt` per species (tab-separated `gene_id<TAB>GO:term`,\
  \ one pair per line).\n\n5. To reuse a previous OrthoFinder run (skips the slow\
  \ OrthoFinder step). Or to use tree/table from another source use:\n\nOrthoFinder\
  \ v3 (default):\n```\n# NXF_VER=25.04.8\nnextflow run main.nf -resume -profile docker\
  \ \\\n  --input data/input_small-s3.csv \\\n  --input_tree results/orthofinder_cafe/ortho_cafe/Species_Tree/SpeciesTree_rooted_node_labels.txt\
  \ \\\n  --input_orthogroups results/orthofinder_cafe/ortho_cafe/Orthogroups/Orthogroups.tsv\n\
  ```\n\nOrthoFinder v2 (`--orthofinder_v2`):\n```\n# NXF_VER=25.04.8\nnextflow run\
  \ main.nf -resume -profile docker \\\n  --input data/input_small-s3.csv \\\n  --input_tree\
  \ results/orthofinder_cafe/ortho_cafe/Species_Tree/SpeciesTree_rooted_node_labels.txt\
  \ \\\n  --input_orthogroups results/orthofinder_cafe/ortho_cafe/Phylogenetic_Hierarchical_Orthogroups/N0.tsv\n\
  ```\n\n## Output Structure\n\n> For a detailed description of outputs with example\
  \ figures, see the **[Output Guide](https://github.com/Eco-Flow/excon/blob/main/docs/outputs.md)**.\n\
  ```\nresults/\n\u251C\u2500\u2500 cafe/\n\u2502   \u251C\u2500\u2500 base/     \
  \                   # CAFE_PREP outputs\n\u2502   \u2502   \u251C\u2500\u2500 hog_gene_counts.tsv\
  \      # Filtered gene count input to CAFE\n\u2502   \u2502   \u251C\u2500\u2500\
  \ hog_filtering_report.tsv # Filtering report (only present if retry triggered)\n\
  \u2502   \u2502   \u2514\u2500\u2500 SpeciesTree_rooted_ultra.txt  # Ultrametric\
  \ tree used by CAFE5\n\u2502   \u251C\u2500\u2500 best/                        #\
  \ Full CAFE5 results for the winning model (uniform or Poisson)\n\u2502   \u251C\
  \u2500\u2500 large_families/              # CAFE run on high-differential families\
  \ (retry path only)\n\u2502   \u2514\u2500\u2500 model_comparison/\n\u2502     \
  \  \u251C\u2500\u2500 cafe_model_comparison.tsv # Uniform vs Poisson comparison\
  \ at best k\n\u2502       \u2514\u2500\u2500 best_model.txt            # \"uniform\"\
  \ or \"poisson\"\n\u251C\u2500\u2500 cafe_plot/\n\u2502   \u2514\u2500\u2500 cafe_plotter/\
  \                # Expansion/contraction plots for best model\n\u251C\u2500\u2500\
  \ cafe_go/\n\u2502   \u2514\u2500\u2500 <algo>_cutoff<val>_type<val>/  # One subfolder\
  \ per GO parameter combination\n\u2502       \u251C\u2500\u2500 CAFE_summary.txt\
  \           # Summary of expansions/contractions per branch\n\u2502       \u251C\
  \u2500\u2500 *_TopGo_results_ALL.tab    # TopGO results per target\n\u2502     \
  \  \u251C\u2500\u2500 TopGO_barplot_*.pdf        # Bar chart per target (ggplot2,\
  \ full GO names)\n\u2502       \u251C\u2500\u2500 TopGO_dotplot_*.pdf        # Dot\
  \ plot per target (fold enrichment x significance)\n\u2502       \u251C\u2500\u2500\
  \ TopGO_Pval_barplot_*.pdf   # Legacy barplots (base R)\n\u2502       \u251C\u2500\
  \u2500 Go_summary_pos.pdf         # Summary plot across all expansions\n\u2502 \
  \      \u251C\u2500\u2500 Go_summary_neg.pdf         # Summary plot across all contractions\n\
  \u2502       \u251C\u2500\u2500 Go_summary_pos_noNode.pdf  # As above, terminal\
  \ branches only\n\u2502       \u2514\u2500\u2500 Go_summary_neg_noNode.pdf\n\u251C\
  \u2500\u2500 chromo_go/                         # [optional] GO enrichment by chromosome\n\
  \u2502   \u2514\u2500\u2500 <algo>_cutoff<val>_type<val>/  # One subfolder per GO\
  \ parameter combination\n\u2502       \u251C\u2500\u2500 *.pdf                 \
  \     # Per-chromosome GO plots\n\u2502       \u2514\u2500\u2500 summary/      \
  \             # Summarized results across chromosomes\n\u251C\u2500\u2500 eggnogmapper/\n\
  \u2502   \u251C\u2500\u2500 *.emapper.annotations        # Raw EggNOG-mapper annotation\
  \ files (one per species)\n\u2502   \u251C\u2500\u2500 OG_annotation_summary.tsv\
  \    # Per-orthogroup functional summary (description, COG, KEGG, PFAM)\n\u2502\
  \   \u2514\u2500\u2500 go_files/                    # Per-species GO annotation\
  \ files\n\u251C\u2500\u2500 gffread/\n\u2502   \u2514\u2500\u2500 *.fasta      \
  \                # Protein sequences per species\n\u251C\u2500\u2500 ncbigenomedownload/\n\
  \u2502   \u251C\u2500\u2500 *.fna.gz                     # Downloaded genome assemblies\n\
  \u2502   \u2514\u2500\u2500 *.gff.gz                     # Downloaded annotations\n\
  \u251C\u2500\u2500 orthofinder_cafe/\n\u2502   \u2514\u2500\u2500 ortho_cafe/  \
  \                # OrthoFinder results including species tree\n\u251C\u2500\u2500\
  \ busco/                           # [optional, --stats] BUSCO completeness results\n\
  \u251C\u2500\u2500 agat/                            # [optional, --stats] AGAT annotation\
  \ statistics\n\u251C\u2500\u2500 quast/                           # [optional, --stats]\
  \ Assembly contiguity statistics\n\u2514\u2500\u2500 pipeline_info/\n    \u251C\u2500\
  \u2500 execution_report_*.html      # Nextflow execution report\n    \u251C\u2500\
  \u2500 execution_timeline_*.html    # Per-process timeline\n    \u251C\u2500\u2500\
  \ execution_trace_*.txt        # Per-task resource usage\n    \u251C\u2500\u2500\
  \ pipeline_dag_*.html          # Pipeline DAG diagram\n    \u2514\u2500\u2500 software_versions.yml\
  \        # Versions of all tools used\n```\n\n\n\n## Citation\n\nThis pipeline is\
  \ published on Workflowhub using the nf-core template. If you use this pipeline\
  \ in you work, the following citations are essential:\n\nexcon:\nWyatt, C. (2026).\
  \ Gene EXpansion and CONtraction analysis pipeline. WorkflowHub. https://doi.org/10.48546/WORKFLOWHUB.WORKFLOW.2141.8\n\
  \nnf-core:\nPhilip Ewels, Alexander Peltzer, Sven Fillinger, Harshil Patel, Johannes\
  \ Alneberg, Andreas Wilm, Maxime Ulysse Garcia, Paolo Di Tommaso & Sven Nahnsen.\n\
  Nat Biotechnol. 2020 Feb 13. doi: 10.1038/s41587-020-0439-x.\n\nIf you used any\
  \ of these tools within the pipeline, you must also cite:\n\nCAFE:\nF\xE1bio K Mendes,\
  \ Dan Vanderpool, Ben Fulton, Matthew W Hahn, CAFE 5 models variation in evolutionary\
  \ rates among gene families, \nBioinformatics, 2020; btaa1022, https://doi.org/10.1093/bioinformatics/btaa1022\n\
  \nOrthofinder:\nEmms, D.M. and Kelly, S. (2019) OrthoFinder: phylogenetic orthology\
  \ inference for comparative genomics. \nGenome Biology 20:238\n\nAGAT:\nDainat J.\
  \ 2022. Another Gtf/Gff Analysis Toolkit (AGAT): Resolve interoperability issues\
  \ and accomplish more with your annotations. Plant and Animal Genome XXIX Conference.\
  \ https://github.com/NBISweden/AGAT.\n\neggNOG-mapper (if used):\nCarlos P Cantalapiedra,\
  \ Ana Hern\xE1ndez-Plaza, Ivica Letunic, Peer Bork, Jaime Huerta-Cepas, eggNOG-mapper\
  \ v2: Functional Annotation, Orthology Assignments, and Domain Prediction at the\
  \ Metagenomic Scale, Molecular Biology and Evolution, Volume 38, Issue 12, December\
  \ 2021, Pages 5825\u20135829, https://doi.org/10.1093/molbev/msab293\n\nA full list\
  \ of tools and their versions are found in the `software_versions.yml` in the `results/pipeline_info`.\
  \ So ensure to look here for any additional tools you need to cite.\n\nFor the --stats\
  \ module, you would need to cite BUSCO, Quast, AGAT\n\n## Contact Us\n\nIf you need\
  \ any support do not hesitate to contact us at any of:\n\n`c.wyatt [at] ucl.ac.uk`\
  \ \n\n`ecoflow.ucl [at] gmail.com`"
