# Event hosts -> corner logo(s) shown on each Events card: whose event it is.
# Set `host:` in an event's front matter to one of these keys, or a list of
# them for a joint event, e.g. `host: [nf-core, ucl]` (defaults to eco-flow).
# Eco-Flow's own part in the event goes in `role:` (see event_roles.yml).
eco-flow:
  name: Eco-Flow
  logo: /img/favicon-256.png
nf-core:
  name: nf-core
  logo: /img/nfcore-apple.png
ucl:
  name: UCL
  logo: /img/ucl-mark.png
workflowhub:
  name: WorkflowHub
  logo: /img/workflowhub-mark.svg
seqera:
  name: Seqera
  logo: /img/seqera-logo.svg
yzg:
  name: Young Zoologist Group
  logo: /img/yzg-mark.png
ku-leuven:
  name: KU Leuven
  logo: /img/kuleuven-logo.svg
diets:
  name: DIETS Symposium
  logo: /img/diets.png
