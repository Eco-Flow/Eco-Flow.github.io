# Eco-Flow Basic Nextflow Training course, surfaced on /training/.
# Lessons live in the Eco-Flow/training repo; each part links out to its doc.
title: Eco-Flow Basic Nextflow Training
intro: >
  A hands-on course that takes you from limited bioinformatics experience to
  running your own nf-core pipelines. It's pitched at beginners — no prior
  Nextflow experience is needed, and only basic command-line familiarity is
  assumed (Part 1 covers the terminal from scratch if you're new to it; the
  later differential-expression part assumes a little R). Everything runs in
  the browser via GitHub Codespaces, so there's nothing to install.
# Funder credit shown under the intro on /training/.
sponsor:
  text: This course was developed with the support of
  name: BioFAIR
  url: https://biofair.uk/
  logo: /img/biofair-logo.png
repo: https://github.com/Eco-Flow/training
base: https://github.com/Eco-Flow/training/blob/main/eco-flow-training/docs/
parts:
  - num: "0"
    title: Setup
    type: Practical
    body: Get your environment ready with GitHub Codespaces, so you can run everything from your browser.
    file: setup.md
  - num: "1"
    title: Command line basics
    type: Practical · optional
    body: A gentle introduction to the command line. Skip this part if you're already comfortable in a terminal.
    file: commandline.md
  - num: "2"
    title: Pipelines with Nextflow
    type: Lecture
    body: What Nextflow and nf-core are, and why pipelines matter for reproducible, scalable science.
    file: pipelines.md
  - num: "3"
    title: Run an nf-core RNA-Seq pipeline
    type: Practical
    body: Hands-on — run a real nf-core/rnaseq analysis end to end, from raw reads to results.
    file: nfcore_rnaseq.md
  - num: "4"
    title: Differential gene expression
    type: Practical
    body: Take the counts from the RNA-Seq pipeline and find what changed — normalise with DESeq2, run differential expression, and interpret the results in R.
    file: differential.md
  - num: "★"
    title: Running a pipeline on an HPC
    type: Reference
    bonus: true
    body: A conceptual guide to moving a pipeline onto a High-Performance Computing cluster — what to ask your HPC team, where to find configs, and how to test one. Reading, not a hands-on run.
    file: hpc.md
