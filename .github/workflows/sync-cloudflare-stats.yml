name: Sync Cloudflare stats

on:
  schedule:
    - cron: "37 5 * * *"  # daily at 05:37 UTC
    - cron: "37 17 * * *" # backup run 12h later, in case the morning schedule
                          # is dropped/delayed by GitHub (also re-triggers the
                          # Pages deploy). Only refreshes _data/stats.yml.
  push:
    branches: [publish] # also refresh on every merge/push to the live site
  workflow_dispatch: {}

permissions:
  contents: write

# Don't let two runs (e.g. a push and the daily schedule) overlap and clash.
concurrency:
  group: sync-cloudflare-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch Cloudflare Web Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/fetch_cloudflare_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/stats.yml _data/stats_totals.yml
          if ! git diff --cached --quiet; then
            git commit -m "Sync Cloudflare stats"
            git pull --rebase origin publish
            git push
          fi
