name: Snapshot stats history

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, after the daily syncs have run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Append weekly snapshot
        run: python3 scripts/snapshot_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/stats_history.csv _data/stats_totals.yml
          if ! git diff --cached --quiet; then
            git commit -m "Weekly stats snapshot"
            git pull --rebase origin publish
            git push
          fi
