name: Sync pipeline metadata

on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  push:
    branches: [publish] # also refresh on every merge/push to the live site
  workflow_dispatch: {}

permissions:
  contents: write

# Don't let two runs (e.g. a push and the daily schedule) overlap and clash.
concurrency:
  group: sync-pipeline-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_pipeline_meta.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/pipelines_meta.yml _data/pipeline_readmes.yml
          if ! git diff --cached --quiet; then
            git commit -m "Sync pipeline metadata from GitHub"
            git pull --rebase origin publish
            git push
          fi
