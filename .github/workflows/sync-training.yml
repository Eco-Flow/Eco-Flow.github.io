name: Sync training lessons

on:
  schedule:
    - cron: "37 4 * * *" # daily at 04:37 UTC
  push:
    branches: [publish] # also refresh on every merge/push to the live site
  repository_dispatch:
    types: [training-updated] # fired by Eco-Flow/training on push (instant sync)
  workflow_dispatch: {}

permissions:
  contents: write

# Don't let two runs (e.g. a push and the daily schedule) overlap and clash.
concurrency:
  group: sync-training
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run sync script
        run: python3 scripts/sync_training.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _training assets/training
          if ! git diff --cached --quiet; then
            git commit -m "Sync training lessons from Eco-Flow/training"
            git pull --rebase origin publish
            git push
          fi
