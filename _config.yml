theme: minima
title: Home
description: A community of computational agri-ecologists
url: "https://eco-flow.github.io"


# Allow future-dated posts to be published
future: true

plugins:
  - jekyll-feed
  - jekyll-titles-from-headings

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: false

collections:
  pipelines:
    output: true
  events:
    output: true

authors: Chris Wyatt, Fernando Duarte

minima:
  nav_pages:
    - index.md
    - about.md
    - services.md
    - pipelines.md
    - partners.md
    - blog.html
    - events.html
