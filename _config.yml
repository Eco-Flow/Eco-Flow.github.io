# We ship a fully custom theme: our own _layouts, _includes, _sass and
# assets/main.scss shadow everything minima provides. minima is named only to
# stop the github-pages gem injecting its jekyll-theme-primer default.
theme: minima

title: Eco-Flow
description: A community of computational agri-ecologists building reproducible Nextflow pipelines for ecology.
url: "https://eco-flow.github.io"

# Allow future-dated posts/events to be published
future: true

plugins:
  - jekyll-feed
  - jekyll-titles-from-headings
  - jekyll-redirect-from
  - jekyll-sitemap

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: false

collections:
  pipelines:
    output: true
    permalink: /pipelines/:name/
  events:
    output: true
    permalink: /events/:name/
  training:
    output: true
    permalink: /training/:name/

# Default layouts per content type so individual files don't need to set them.
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "events" }
    values: { layout: "event" }
  - scope: { path: "", type: "pipelines" }
    values: { layout: "pipeline" }
  - scope: { path: "", type: "training" }
    values: { layout: "training" }

authors: Chris Wyatt, Fernando Duarte

# Internal docs / config that should not be published as pages.
exclude:
  - README.md
  - MAINTAINING.md
  - test_locally.md
  - website-structure.md
  - Gemfile
  - Gemfile.lock
  - .gitpod.yml
  - vendor
